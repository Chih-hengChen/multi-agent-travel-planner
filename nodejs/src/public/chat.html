<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI 旅行规划助手</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<style>
  .chat-scroll::-webkit-scrollbar{width:4px}
  .chat-scroll::-webkit-scrollbar-thumb{background:#cbd5e1;border-radius:4px}
  #input:focus{outline:none}
  .typing::after{content:"▌";animation:blink 1s step-end infinite}
  @keyframes blink{50%{opacity:0}}
  .msg-content p{margin-bottom:6px}
  .msg-content ul,.msg-content ol{padding-left:20px;margin-bottom:6px}
  .msg-content li{margin-bottom:2px}
  .plan-card{background:linear-gradient(135deg,#eff6ff,#f0fdf4);border:1px solid #bfdbfe;border-radius:12px;padding:16px;margin-top:12px}
  .plan-card h3{font-size:1.1rem;font-weight:700;margin-bottom:8px}
  .cost-bar{height:8px;border-radius:4px;background:#e5e7eb;overflow:hidden}
  .cost-bar-fill{height:100%;border-radius:4px;transition:width .6s ease}
  .day-card{background:#fff;border:1px solid #e5e7eb;border-radius:8px;padding:12px;margin-top:8px}
  .day-card h4{font-weight:600;color:#1e40af;margin-bottom:6px}
  .act-item{display:flex;justify-content:space-between;align-items:center;padding:4px 0;border-bottom:1px solid #f1f5f9;font-size:0.85rem}
  .act-item:last-child{border-bottom:none}
  .progress-bar{height:4px;background:#e5e7eb;border-radius:2px;overflow:hidden}
  .progress-bar-fill{height:100%;border-radius:2px;background:#3b82f6;transition:width .4s ease}
  .state-badge{font-size:0.65rem;padding:2px 8px;border-radius:9999px;font-weight:600;white-space:nowrap}
  .pulse{animation:pulse 1.5s ease-in-out infinite}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.5}}
  .act-draggable{cursor:grab;transition:opacity .2s}
  .act-draggable:active{cursor:grabbing}
  .act-draggable.dragging{opacity:.4}
  .act-drop-zone{min-height:8px;transition:background .15s}
  .act-drop-zone.drag-over{background:#dbeafe;border-radius:4px}
  .act-edit-card{border:1px solid #e5e7eb;border-radius:8px;padding:8px;margin:4px 0;background:#fff}
  .act-edit-card .note-input{border:1px solid #e2e8f0;border-radius:4px;padding:2px 6px;font-size:0.75rem;width:100%;margin-top:4px}
  .act-edit-card .note-input:focus{outline:none;border-color:#3b82f6}
  .act-edit-card .del-btn{cursor:pointer;color:#9ca3af;font-size:0.75rem;padding:2px 6px;border-radius:4px}
  .act-edit-card .del-btn:hover{color:#ef4444;background:#fef2f2}

  .timeline{position:relative;padding:2px 0 2px 20px}
  .timeline::before{content:"";position:absolute;left:7px;top:8px;bottom:8px;width:2px;background:#d1d5db;border-radius:1px}
  .tl-stop{position:relative;padding:4px 0}
  .tl-stop .dot{position:absolute;left:-16px;top:10px;width:10px;height:10px;border-radius:50%;background:#3b82f6;border:2px solid #fff;box-shadow:0 0 0 2px #3b82f6}
  .tl-time{display:inline-block;font-size:0.65rem;color:#6b7280;background:#f3f4f6;border-radius:9999px;padding:0 8px;line-height:18px;white-space:nowrap}
  .tl-transit{position:relative;padding:1px 0;font-size:0.7rem}
  .tl-transit .sep{color:#d1d5db}
  .ref-item{background:#fff;border:1px solid #e5e7eb;border-radius:8px;padding:6px 10px;margin-bottom:4px;font-size:0.75rem}

</style>
</head>
<body class="bg-gray-50 h-screen flex flex-col">

<header class="bg-white border-b px-6 py-3 flex items-center gap-3 shrink-0">
  <span class="text-2xl">✈️</span>
  <div class="flex-1">
    <h1 class="text-lg font-semibold text-gray-800">AI 旅行规划助手</h1>
    <p class="text-xs text-gray-400">Multi-Agent · Real APIs · Smart Routing</p>
  </div>
  <div id="stateIndicator" class="flex items-center gap-2">
    <span id="stateBadge" class="state-badge bg-gray-200 text-gray-600">等待中</span>
    <div class="progress-bar w-20 hidden" id="progressBarWrap">
      <div class="progress-bar-fill" id="progressBarFill" style="width:0%"></div>
    </div>
  </div>
  <button id="newChatBtn" class="text-xs text-gray-400 hover:text-blue-600 border rounded-lg px-3 py-1.5 transition" title="新对话">新对话</button>
</header>

<main id="chat" class="flex-1 overflow-y-auto chat-scroll px-4 py-6 max-w-3xl mx-auto w-full space-y-4">
  <div class="bg-gray-100 rounded-2xl rounded-tl-sm px-4 py-3 max-w-[80%] text-sm text-gray-700 leading-relaxed msg-content">
    <p>你好！我是你的旅行规划助手。告诉我你想去哪里旅行，我会帮你规划完整的行程。</p>
    <p>比如："我想从上海去北京旅游，7月10号到14号，2个人，预算1万"</p>
  </div>
</main>

<footer class="bg-white border-t px-4 py-3 shrink-0">
  <form id="form" class="max-w-3xl mx-auto flex gap-2">
    <input id="input" type="text" placeholder="输入你的旅行需求，如：我想去北京旅游..."
      class="flex-1 border rounded-xl px-4 py-2.5 text-sm bg-gray-50 focus:bg-white transition" autocomplete="off">
    <button id="btn" type="submit"
      class="bg-blue-600 text-white px-5 py-2.5 rounded-xl text-sm font-medium hover:bg-blue-700 disabled:opacity-50 disabled:cursor-not-allowed transition">
      发送
    </button>
  </form>
</footer>

<script>
const chatEl = document.getElementById('chat');
const formEl = document.getElementById('form');
const inputEl = document.getElementById('input');
const btnEl = document.getElementById('btn');
const stateBadge = document.getElementById('stateBadge');
const progressBarWrap = document.getElementById('progressBarWrap');
const progressBarFill = document.getElementById('progressBarFill');

let sessionId = localStorage.getItem('travel_session_id');
let streaming = false;
let editMode = false;
let editingPlan = null;
let currentPlanData = null;
let dragSrcInfo = null;

marked.setOptions({ breaks: true });

const STATE_LABELS = {
  INIT: { text: '等待中', color: 'bg-gray-200 text-gray-600' },
  GATHERING_BASICS: { text: '了解基本信息', color: 'bg-blue-100 text-blue-700' },
  GATHERING_PREFERENCES: { text: '收集偏好', color: 'bg-purple-100 text-purple-700' },
  SEARCHING_TRANSPORT: { text: '搜索交通', color: 'bg-amber-100 text-amber-700 pulse' },
  SELECTING_TRANSPORT: { text: '选择交通', color: 'bg-cyan-100 text-cyan-700' },
  SEARCHING_HOTELS: { text: '搜索酒店', color: 'bg-amber-100 text-amber-700 pulse' },
  SELECTING_HOTEL: { text: '选择酒店', color: 'bg-teal-100 text-teal-700' },
  SEARCHING: { text: '正在规划行程', color: 'bg-amber-100 text-amber-700 pulse' },
  COMPLETED: { text: '规划完成', color: 'bg-green-100 text-green-700' },
  ERROR: { text: '出错了', color: 'bg-red-100 text-red-700' },
};

const STATE_PROGRESS = {
  INIT: 0,
  GATHERING_BASICS: 15,
  GATHERING_PREFERENCES: 30,
  SEARCHING_TRANSPORT: 40,
  SELECTING_TRANSPORT: 50,
  SEARCHING_HOTELS: 60,
  SELECTING_HOTEL: 70,
  SEARCHING: 85,
  COMPLETED: 100,
  ERROR: 0,
};

function updateStateUI(state) {
  const info = STATE_LABELS[state] || STATE_LABELS.INIT;
  stateBadge.textContent = info.text;
  stateBadge.className = 'state-badge ' + info.color;
  const pct = STATE_PROGRESS[state] || 0;
  if (pct > 0 && pct < 100) {
    progressBarWrap.classList.remove('hidden');
    progressBarFill.style.width = pct + '%';
  } else if (pct === 100) {
    progressBarFill.style.width = '100%';
    setTimeout(() => progressBarWrap.classList.add('hidden'), 1500);
  } else {
    progressBarWrap.classList.add('hidden');
  }
}

function esc(s) {
  const d = document.createElement('div');
  d.textContent = s;
  return d.innerHTML;
}

function scrollBottom() { chatEl.scrollTop = chatEl.scrollHeight; }

function addUserBubble(text) {
  const div = document.createElement('div');
  div.className = 'flex justify-end';
  div.innerHTML = `<div class="bg-blue-100 rounded-2xl rounded-tr-sm px-4 py-3 max-w-[80%] text-sm text-gray-800">${esc(text)}</div>`;
  chatEl.appendChild(div);
  scrollBottom();
}

function createBotBubble() {
  const wrap = document.createElement('div');
  wrap.className = 'flex justify-start';
  const bubble = document.createElement('div');
  bubble.className = 'bg-gray-100 rounded-2xl rounded-tl-sm px-4 py-3 max-w-[80%] text-sm text-gray-700 leading-relaxed msg-content typing';
  wrap.appendChild(bubble);
  chatEl.appendChild(wrap);
  scrollBottom();
  return bubble;
}

function finalizeBotBubble(bubble, text, extraHtml) {
  bubble.classList.remove('typing');
  bubble.innerHTML = marked.parse(text);
  if (extraHtml) bubble.innerHTML += extraHtml;
  scrollBottom();
}

function renderPlanCard(plan) {
  currentPlanData = plan;
  const pct = plan.budget > 0 ? Math.min((plan.totalCost / plan.budget) * 100, 100) : 0;
  const barColor = plan.withinBudget ? 'bg-green-500' : 'bg-red-500';
  const statusText = plan.withinBudget ? '预算内 ✓' : `超支 ¥${(plan.totalCost - plan.budget).toLocaleString()}`;
  const editBtn = editMode
    ? `<div class="flex gap-2 mb-2"><button onclick="savePlanEdit()" class="text-xs bg-blue-600 text-white px-3 py-1 rounded-lg hover:bg-blue-700">保存</button><button onclick="cancelPlanEdit()" class="text-xs border px-3 py-1 rounded-lg hover:bg-gray-100">取消</button></div>`
    : `<button onclick="enterEditMode()" class="text-xs text-blue-600 border border-blue-200 px-3 py-1 rounded-lg hover:bg-blue-50 float-right">编辑行程</button>`;

  const fromCity = plan.departureCity || '';
  const dateRange = plan.departureDate && plan.returnDate
    ? `${fmtDate(plan.departureDate)} - ${fmtDate(plan.returnDate)}`
    : `${plan.days || ''}天`;
  const transportLabel = plan.transportMode === 'train' ? '高铁' : '航班';

  const costLines = [];
  if (plan.trainCost > 0) costLines.push(`往返${transportLabel}，${plan.trainCost.toLocaleString()}元`);
  else if (plan.flightCost > 0) costLines.push(`往返${transportLabel}，${plan.flightCost.toLocaleString()}元`);
  if (plan.hotelCost > 0) costLines.push(`酒店${plan.hotelCost.toLocaleString()}元`);
  if (plan.activityCost > 0) costLines.push(`活动${plan.activityCost.toLocaleString()}元`);

  function renderTransportDetail(label, t) {
    if (!t) return '';
    return `<div class="text-xs mt-1">${label}：<span class="font-medium">${esc(t.trainNo)}</span> ${esc(t.departureCity||t.departStation)} → ${esc(t.arrivalCity||t.arriveStation)}，${t.departureTime} - ${t.arrivalTime}，<span class="text-blue-600">¥${t.price}</span></div>`;
  }

  function renderTimelineStop(a) {
    const icon = a.subType === 'dining' ? '🍽️' : a.subType === 'attraction' ? '📍' : '📍';
    const timeLabel = ({ morning: '上午', afternoon: '下午', evening: '晚上' })[a.timeSlot] || '';
    const duration = a.durationHours > 0 ? `<span class="text-gray-400 text-xs ml-1">${a.durationHours}小时</span>` : '';
    const cost = a.price > 0 ? `<span class="text-blue-600 font-medium text-xs">¥${a.price}</span>` : `<span class="text-gray-400 text-xs">免费</span>`;
    const desc = a.description ? `<div class="text-gray-400 text-xs mt-0.5 leading-relaxed">${esc(a.description)}</div>` : '';
    return `<div class="tl-stop">
      <div class="dot"></div>
      <div class="flex items-start gap-1.5" style="padding-left:2px">
        <span class="mt-0.5">${icon}</span>
        <div class="flex-1 min-w-0">
          <div class="flex items-center gap-1 flex-wrap">
            <span class="font-medium text-gray-800 text-sm">${esc(a.name)}</span>
            ${cost}
            ${timeLabel ? `<span class="tl-time">${timeLabel}</span>` : ''}
            ${duration}
          </div>
          ${desc}
        </div>
      </div>
    </div>`;
  }

  function renderTimelineTransit(a) {
    const desc = esc(a.description || '');
    let direction = '';
    if (desc.includes('→')) {
      const parts = desc.split('→');
      const from = parts[0].trim();
      const to = parts.length >= 2 ? (parts[1].includes(' ') ? parts[1].split(' ')[0] : parts[1].trim()) : '';
      direction = `<span class="font-medium text-gray-500">${from}</span><span class="sep"> → </span><span class="font-medium text-gray-500">${to}</span>`;
    }
    const modeIcon = a.name.includes('步行') ? '🚶' : a.name.includes('地铁') ? '🚇' : a.name.includes('公交') ? '🚌' : a.name.includes('打车') ? '🚕' : '🚗';
    const minutes = a.durationHours > 0 ? `${Math.round(a.durationHours * 60)}分钟` : '';
    return `<div class="tl-transit">
      <div class="flex items-center gap-1 pl-1 text-gray-400">
        <span class="sep">┊</span>
        <span>${modeIcon}</span>
        <span class="text-gray-500">${direction || esc(a.name)}</span>
        ${minutes ? `<span class="text-gray-400">· ${minutes}</span>` : ''}
        ${a.price > 0 ? `<span class="text-gray-400">· ¥${a.price}</span>` : ''}
      </div>
    </div>`;
  }

  let hotelAltHtml = '';
  if (plan.hotelAlternatives && plan.hotelAlternatives.length > 0) {
    hotelAltHtml = '<div class="mt-2 text-xs text-gray-500">酒店备选：';
    hotelAltHtml += plan.hotelAlternatives.map(h =>
      `${esc(h.name)}，¥${h.pricePerNight}/晚${h.note ? '，' + esc(h.note) : ''}`
    ).join('；');
    hotelAltHtml += '</div>';
  }

  const hotelStay = plan.hotelCheckIn && plan.hotelCheckOut
    ? `${plan.hotelCheckIn} 入住 — ${plan.hotelCheckOut} 退房`
    : plan.departureDate && plan.returnDate
      ? `${plan.departureDate} — ${plan.returnDate}`
      : '';

  let html = `
    <div class="plan-card !bg-white !border-gray-200">
      <div class="flex items-start justify-between mb-3">
        <div>
          <h3 class="text-base font-bold text-gray-900">${fromCity ? esc(fromCity) + '出发' : ''}${esc(plan.destination)}旅行计划</h3>
          <div class="text-xs text-gray-400 mt-0.5">${dateRange} · ${plan.numTravelers ? plan.numTravelers + '人' : ''}</div>
        </div>
        ${editMode ? '' : editBtn}
      </div>
      ${editMode ? editBtn : ''}
      <div class="bg-blue-50 rounded-lg p-3 mb-3">
        <div class="text-sm font-bold text-gray-800">合计花费：¥${plan.totalCost.toLocaleString()}</div>
        <div class="text-xs text-gray-500 mt-1">${costLines.join('，')}</div>
      </div>
      <div class="flex items-center gap-2 text-xs mb-2">
        <span class="font-semibold">预算 ¥${plan.budget.toLocaleString()}</span>
        <span class="ml-auto ${plan.withinBudget ? 'text-green-600' : 'text-red-600'} font-semibold">${statusText}</span>
      </div>
      <div class="cost-bar"><div class="cost-bar-fill ${barColor}" style="width:${pct}%"></div></div>`;

  if (plan.transportMode === 'train' && (plan.trainOutbound || plan.trainReturn)) {
    html += '<div class="mt-3 pt-3 border-t border-gray-100">';
    html += '<div class="text-xs font-semibold text-gray-700 mb-1">🚄 出行交通：往返' + transportLabel + '</div>';
    html += renderTransportDetail('去程', plan.trainOutbound);
    html += renderTransportDetail('返程', plan.trainReturn);
    html += '</div>';
  } else if (plan.transportMode === 'flight' && (plan.outboundFlights?.length > 0 || plan.returnFlights?.length > 0)) {
    html += '<div class="mt-3 pt-3 border-t border-gray-100">';
    html += '<div class="text-xs font-semibold text-gray-700 mb-1">✈️ 出行交通：往返' + transportLabel + '</div>';
    if (plan.outboundFlights[0]) {
      const f = plan.outboundFlights[0];
      html += `<div class="text-xs mt-1">去程：<span class="font-medium">${esc(f.flightNo)}</span> ${esc(f.departureCity)} → ${esc(f.arrivalCity)}，${f.departureTime?.slice(11,16)} - ${f.arrivalTime?.slice(11,16)}，<span class="text-blue-600">¥${f.price}</span></div>`;
    }
    if (plan.returnFlights[0]) {
      const f = plan.returnFlights[0];
      html += `<div class="text-xs mt-1">返程：<span class="font-medium">${esc(f.flightNo)}</span> ${esc(f.departureCity)} → ${esc(f.arrivalCity)}，${f.departureTime?.slice(11,16)} - ${f.arrivalTime?.slice(11,16)}，<span class="text-blue-600">¥${f.price}</span></div>`;
    }
    html += '</div>';
  }

  if (plan.hotelName) {
    html += '<div class="mt-3 pt-3 border-t border-gray-100">';
    html += '<div class="text-xs font-semibold text-gray-700 mb-1">🏨 酒店选择</div>';
    html += `<div class="text-xs">${esc(plan.hotelName)}`;
    if (plan.hotelStarRating) html += ` ${'⭐'.repeat(Math.min(plan.hotelStarRating,5))}`;
    if (plan.hotelPricePerNight) html += `，¥${plan.hotelPricePerNight}/晚`;
    html += '</div>';
    if (hotelStay) html += `<div class="text-xs text-gray-400 mt-0.5">${hotelStay}</div>`;
    html += hotelAltHtml;
    html += '</div>';
  }

  if (plan.warnings?.length) {
    html += `<div class="mt-2 text-xs text-amber-600">⚠️ ${plan.warnings.join('；')}</div>`;
  }

  if (plan.dayPlans?.length > 0) {
    html += '<div class="mt-3 pt-3 border-t border-gray-100">';
    html += '<div class="text-xs font-semibold text-gray-700 mb-2">📅 具体行程</div>';
    if (editMode) {
      html += renderEditableDayPlans(editingPlan);
    } else {
      for (let di = 0; di < plan.dayPlans.length; di++) {
        const day = plan.dayPlans[di];
        const dayLabel = di === 0 ? '出发日' : `第 ${di + 1} 天`;
        html += `<div class="bg-white border border-gray-100 rounded-lg p-3 mb-2 last:mb-0 shadow-sm">`;
        const dayCostHtml = day.dayCost > 0 ? `<span class="text-xs text-gray-400">本日 ¥${day.dayCost.toLocaleString()}</span>` : '';
	        html += `<div class="flex items-center justify-between mb-2"><div class="flex items-center gap-2"><span class="text-sm font-bold text-gray-800">${fmtDate(day.date)} ${dayLabel}</span></div>${dayCostHtml}</div>`;
        html += '<div class="timeline">';
        for (const a of day.activities) {
          html += a.subType === 'transit' ? renderTimelineTransit(a) : renderTimelineStop(a);
        }
        html += '</div>';
        html += '</div>';
      }
    }
    html += '</div>';
  } else {
    html += '<div class="mt-3 pt-3 border-t border-gray-100 text-xs text-gray-400">📅 具体行程待生成</div>';
  }

  html += '</div>';
  html += renderDataSources(plan);
  return html;
}

function fmtDate(d) {
  if (!d) return '';
  const parts = d.split('-');
  if (parts.length === 3) return `${parseInt(parts[1])}.${parseInt(parts[2])}`;
  return d;
}

function renderDataSources(plan) {
  let html = '<div class="plan-card mt-3"><h3>📊 参考资料</h3>';

  if (plan.transportMode === 'train') {
    const out = plan.trainOutbound;
    const ret = plan.trainReturn;
    if (out || ret) {
      html += '<div class="mt-2"><div class="text-xs font-semibold text-blue-700 mb-1">🚄 高铁数据</div>';
      html += '<div class="text-xs space-y-1">';
      if (out) {
        html += `<div class="bg-white rounded p-1.5 flex justify-between"><span>去程 ${esc(out.trainNo)} ${esc(out.departureCity)}→${esc(out.arrivalCity)} ${out.departureTime}-${out.arrivalTime}</span><span class="text-blue-600 font-semibold">¥${out.price}</span></div>`;
      }
      if (ret) {
        html += `<div class="bg-white rounded p-1.5 flex justify-between"><span>返程 ${esc(ret.trainNo)} ${esc(ret.departureCity)}→${esc(ret.arrivalCity)} ${ret.departureTime}-${ret.arrivalTime}</span><span class="text-blue-600 font-semibold">¥${ret.price}</span></div>`;
      }
      html += '</div></div>';
    } else {
    const allFlights = [...(plan.outboundFlights || []), ...(plan.returnFlights || [])];
    if (allFlights.length > 0) {
      html += '<div class="mt-2"><div class="text-xs font-semibold text-blue-700 mb-1">✈️ 航班数据</div>';
      html += '<div class="text-xs space-y-1">';
      for (const f of allFlights) {
        html += `<div class="bg-white rounded p-1.5 flex justify-between"><span>${esc(f.airline)} ${esc(f.flightNo)} ${esc(f.departureCity)}→${esc(f.arrivalCity)} ${f.departureTime?.slice(11,16)||''}-${f.arrivalTime?.slice(11,16)||''}</span><span class="text-blue-600 font-semibold">¥${f.price}</span></div>`;
      }
      html += '</div></div>';
    } else {
      html += '<div class="text-xs text-gray-400 mt-1">✈️ 航班：暂无数据</div>';
    }
  }

  if (plan.hotels?.length > 0) {
    html += '<div class="mt-2"><div class="text-xs font-semibold text-green-700 mb-1">🏨 酒店数据</div>';
    html += '<div class="text-xs space-y-1">';
    for (const h of plan.hotels) {
      const stars = '⭐'.repeat(Math.min(h.starRating, 5));
      html += `<div class="bg-white rounded p-1.5 flex justify-between"><span>${stars} ${esc(h.name)} <span class="text-gray-400">${h.userRating?.toFixed(1)||''}</span></span><span class="text-green-600 font-semibold">¥${h.pricePerNight}/晚</span></div>`;
    }
    html += '</div></div>';
  } else {
    html += '<div class="text-xs text-gray-400 mt-1">🏨 酒店：暂无数据</div>';
  }

  if (plan.references?.length > 0) {
    html += '<div class="mt-3 pt-2 border-t border-gray-100"><div class="text-xs font-semibold text-gray-700 mb-1">🔗 参考来源</div><div class="space-y-1">';
    for (const ref of plan.references) {
      const iconMap = { hotel: '🏨', flight: '✈️', train: '🚄', baike: '📖', xhs: '📕', web: '🔗' };
      const icon = iconMap[ref.source] || '🔗';
      html += '<div class="ref-item flex items-center gap-2">';
      html += '<span>' + icon + '</span>';
      html += '<span class="flex-1 text-gray-700">' + esc(ref.title) + '</span>';
      if (ref.description) html += '<span class="text-gray-400 text-xs shrink-0">' + esc(ref.description) + '</span>';
      html += '</div>';
    }
    html += '</div></div>';
  }

  html += '</div>';
  return html;
}

function renderEditableDayPlans(plan) {
  let html = '';
  for (let di = 0; di < plan.dayPlans.length; di++) {
    const day = plan.dayPlans[di];
    html += `<div class="text-xs mt-2"><span class="font-semibold text-gray-600">${esc(day.date)}</span></div>`;
    html += `<div class="day-activities" data-day="${di}">`;
    for (let ai = 0; ai < day.activities.length; ai++) {
      const a = day.activities[ai];
      const icon = a.subType === 'dining' ? '🍽️' : a.subType === 'transit' ? '🚌' : '📍';
      const note = a.note || '';
      html += `<div class="act-edit-card act-draggable" draggable="true" data-day="${di}" data-idx="${ai}"
        ondragstart="onDragStart(event)" ondragend="onDragEnd(event)" ondragover="onDragOver(event)" ondrop="onDrop(event)">
        <div class="flex justify-between items-center">
          <span class="flex items-center gap-1"><span class="text-gray-400 cursor-grab">⠿</span>${icon} ${esc(a.name)} <span class="text-gray-400">¥${a.price}</span></span>
          <span class="del-btn" onclick="deleteActivity(${di},${ai},this)">删除</span>
        </div>
        <input class="note-input" placeholder="添加备注..." value="${esc(note)}" oninput="updateNote(${di},${ai},this.value)">
      </div>`;
    }
    html += `<div class="act-drop-zone" data-day="${di}" data-idx="${day.activities.length}" ondragover="onDragOver(event)" ondrop="onDrop(event)"></div>`;
    html += '</div>';
  }
  return html;
}

function onDragStart(e) {
  const el = e.target.closest('.act-draggable');
  if (!el) return;
  el.classList.add('dragging');
  dragSrcInfo = { day: +el.dataset.day, idx: +el.dataset.idx };
  e.dataTransfer.effectAllowed = 'move';
  e.dataTransfer.setData('text/plain', '');
}

function onDragEnd(e) {
  document.querySelectorAll('.dragging').forEach(el => el.classList.remove('dragging'));
  document.querySelectorAll('.drag-over').forEach(el => el.classList.remove('drag-over'));
  dragSrcInfo = null;
}

function onDragOver(e) {
  e.preventDefault();
  e.dataTransfer.dropEffect = 'move';
  const zone = e.target.closest('.act-drop-zone,.act-draggable');
  if (zone) {
    document.querySelectorAll('.drag-over').forEach(el => el.classList.remove('drag-over'));
    zone.classList.add('drag-over');
  }
}

function onDrop(e) {
  e.preventDefault();
  document.querySelectorAll('.drag-over').forEach(el => el.classList.remove('drag-over'));
  if (!dragSrcInfo || !editingPlan) return;

  const target = e.target.closest('.act-drop-zone,.act-draggable');
  if (!target) return;
  const toDay = +target.dataset.day;
  const toIdx = +target.dataset.idx;
  const fromDay = dragSrcInfo.day;
  const fromIdx = dragSrcInfo.idx;

  if (fromDay === toDay && fromIdx === toIdx) return;

  const act = editingPlan.dayPlans[fromDay].activities.splice(fromIdx, 1)[0];
  const insertIdx = fromDay === toDay && fromIdx < toIdx ? toIdx - 1 : toIdx;
  editingPlan.dayPlans[toDay].activities.splice(insertIdx, 0, act);

  rerenderEditCard();
}

function deleteActivity(di, ai, btn) {
  if (!editingPlan) return;
  editingPlan.dayPlans[di].activities.splice(ai, 1);
  rerenderEditCard();
}

function updateNote(di, ai, value) {
  if (!editingPlan) return;
  editingPlan.dayPlans[di].activities[ai].note = value;
}

function enterEditMode() {
  if (!currentPlanData) return;
  editMode = true;
  editingPlan = JSON.parse(JSON.stringify(currentPlanData));
  rerenderEditCard();
}

function cancelPlanEdit() {
  editMode = false;
  editingPlan = null;
  rerenderEditCard();
}

async function savePlanEdit() {
  if (!editingPlan || !sessionId) return;
  try {
    const resp = await fetch(`/api/chat/${sessionId}/plan`, {
      method: 'PUT',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ plan: editingPlan }),
    });
    if (!resp.ok) throw new Error('Save failed');
    currentPlanData = editingPlan;
    editMode = false;
    editingPlan = null;
    rerenderEditCard();
  } catch (err) {
    alert('保存失败，请重试');
  }
}

function rerenderEditCard() {
  const plan = editMode ? editingPlan : currentPlanData;
  if (!plan) return;
  const cards = document.querySelectorAll('.plan-card');
  if (cards.length === 0) return;
  const last = cards[cards.length - 1];
  last.outerHTML = renderPlanCard(plan);
  scrollBottom();
}

function renderTransportCard(data) {
  const outbound = data.outbound || [];
  const ret = data.return || [];
  if (!outbound.length && !ret.length) return '<div class="text-xs text-gray-400 mt-2">未找到可用交通</div>';

  let html = '<div class="plan-card mt-2"><h3>🚄 请选择交通方式</h3>';

  if (outbound.length) {
    html += '<div class="text-xs font-semibold text-blue-700 mb-1 mt-2">去程</div>';
    html += '<div class="space-y-1.5">';
    outbound.forEach((opt, i) => {
      const icon = opt.mode === 'train' ? '🚄' : '✈️';
      const rec = opt.isRecommended ? '<span class="text-xs bg-green-100 text-green-700 px-1.5 py-0.5 rounded">推荐</span>' : '';
      html += `<label class="flex items-center gap-2 bg-white rounded-lg p-2 border cursor-pointer hover:border-blue-400 transition text-xs">
        <input type="radio" name="outbound" value="${esc(opt.id)}" ${i === 0 ? 'checked' : ''} class="accent-blue-600">
        <span class="flex-1">${icon} ${esc(opt.trainNo || opt.flightNo || '')} ${esc(opt.departStation)}→${esc(opt.arriveStation)} ${esc(opt.departTime)}-${esc(opt.arriveTime)} ${esc(opt.duration)} ${esc(opt.note || '')}</span>
        <span class="font-semibold text-blue-600">¥${opt.price}</span>
        ${rec}
      </label>`;
    });
    html += '</div>';
  }

  if (ret.length) {
    html += '<div class="text-xs font-semibold text-blue-700 mb-1 mt-3">返程</div>';
    html += '<div class="space-y-1.5">';
    ret.forEach((opt, i) => {
      const icon = opt.mode === 'train' ? '🚄' : '✈️';
      const rec = opt.isRecommended ? '<span class="text-xs bg-green-100 text-green-700 px-1.5 py-0.5 rounded">推荐</span>' : '';
      html += `<label class="flex items-center gap-2 bg-white rounded-lg p-2 border cursor-pointer hover:border-blue-400 transition text-xs">
        <input type="radio" name="return" value="${esc(opt.id)}" ${i === 0 ? 'checked' : ''} class="accent-blue-600">
        <span class="flex-1">${icon} ${esc(opt.trainNo || opt.flightNo || '')} ${esc(opt.departStation)}→${esc(opt.arriveStation)} ${esc(opt.departTime)}-${esc(opt.arriveTime)} ${esc(opt.duration)} ${esc(opt.note || '')}</span>
        <span class="font-semibold text-blue-600">¥${opt.price}</span>
        ${rec}
      </label>`;
    });
    html += '</div>';
  }

  html += `<div class="flex gap-2 mt-4">
    <button onclick="confirmTransport(this)" class="flex-1 bg-blue-600 text-white text-sm py-2 rounded-lg hover:bg-blue-700 transition font-medium">确认选择</button>
    <button onclick="rescanTransport(this)" class="text-sm text-gray-500 border rounded-lg px-4 py-2 hover:text-blue-600 transition">重新搜索</button>
  </div>`;
  html += '</div>';
  return html;
}

function renderHotelCard(hotels) {
  if (!hotels?.length) return '<div class="text-xs text-gray-400 mt-2">未找到可用酒店</div>';

  let html = '<div class="plan-card mt-2"><h3>🏨 请选择酒店</h3>';
  html += '<div class="space-y-2">';

  hotels.forEach((h, i) => {
    const stars = '⭐'.repeat(Math.min(Math.round(h.starRating), 5));
    const isFirst = i === 0;
    html += `<div class="bg-white rounded-lg p-3 border ${isFirst ? 'border-green-400' : ''} cursor-pointer hover:border-teal-400 transition" onclick="selectHotel(this, '${esc(h.name)}')">
      <div class="flex justify-between items-start">
        <div>
          <div class="font-semibold text-sm">${esc(h.name)} ${isFirst ? '<span class="text-xs bg-green-100 text-green-700 px-1.5 py-0.5 rounded">推荐</span>' : ''}</div>
          <div class="text-xs text-gray-400 mt-0.5">${stars} ${h.userRating?.toFixed(1) || ''}${h.distanceToCenterKm ? ' · 距市中心' + h.distanceToCenterKm + 'km' : ''}</div>
          ${h.address ? `<div class="text-xs text-gray-400">${esc(h.address)}</div>` : ''}
        </div>
        <div class="text-right">
          <div class="font-bold text-green-600">¥${h.pricePerNight}<span class="text-xs font-normal text-gray-400">/晚</span></div>
        </div>
      </div>
    </div>`;
  });

  html += '</div>';
  html += `<div class="flex gap-2 mt-3">
    <button onclick="goBackToTransport(this)" class="text-sm text-gray-500 border rounded-lg px-4 py-2 hover:text-blue-600 transition">更换交通</button>
  </div>`;
  html += '</div>';
  return html;
}

async function confirmTransport(btn) {
  const card = btn.closest('.plan-card');
  const outboundRadio = card.querySelector('input[name="outbound"]:checked');
  const returnRadio = card.querySelector('input[name="return"]:checked');
  if (!outboundRadio || !returnRadio) {
    alert('请同时选择去程和返程交通');
    return;
  }

  btn.disabled = true;
  btn.textContent = '提交中...';

  const botBubble = createBotBubble();
  await postSelect({
    type: 'transport',
    outboundId: outboundRadio.value,
    returnId: returnRadio.value,
  }, botBubble);
}

async function rescanTransport(btn) {
  btn.disabled = true;
  const botBubble = createBotBubble();
  await postSelect({ type: 'transport', action: 'rescan' }, botBubble);
}

async function selectHotel(el, hotelName) {
  const card = el.closest('.plan-card');
  card.querySelectorAll('div[onclick]').forEach(d => d.style.opacity = '0.5');
  el.style.opacity = '1';
  el.style.border = '2px solid #14b8a6';

  const botBubble = createBotBubble();
  await postSelect({ type: 'hotel', hotelId: hotelName }, botBubble);
}

async function goBackToTransport(btn) {
  btn.disabled = true;
  const botBubble = createBotBubble();
  await postSelect({ type: 'transport', action: 'rescan' }, botBubble);
}

async function postSelect(body, botBubble) {
  let fullText = '';
  let planData = null;
  let rendered = false;

  try {
    const resp = await fetch(`/api/chat/${sessionId}/select`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(body),
    });

    if (!resp.ok) {
      const err = await resp.json().catch(() => ({}));
      finalizeBotBubble(botBubble, `❌ 选择失败: ${err.error || resp.status}`, null);
      return;
    }

    const reader = resp.body.getReader();
    const decoder = new TextDecoder();
    let buffer = '';
    let currentEvent = '';

    while (true) {
      const { done, value } = await reader.read();
      if (done) break;
      buffer += decoder.decode(value, { stream: true });
      const lines = buffer.split('\n');
      buffer = lines.pop() ?? '';

      for (const line of lines) {
        if (line.startsWith('event: ')) {
          currentEvent = line.slice(7).trim();
        } else if (line.startsWith('data: ')) {
          try {
            const data = JSON.parse(line.slice(6));
            if (currentEvent === 'text_delta') {
              fullText += data.text;
              botBubble.innerHTML = marked.parse(fullText);
              scrollBottom();
            } else if (currentEvent === 'state_change') {
              updateStateUI(data.state);
            } else if (currentEvent === 'transport_options') {
              rendered = true;
              botBubble.classList.remove('typing');
              botBubble.innerHTML = marked.parse(fullText) + renderTransportCard(data);
              scrollBottom();
            } else if (currentEvent === 'hotel_options') {
              rendered = true;
              botBubble.classList.remove('typing');
              botBubble.innerHTML = marked.parse(fullText) + renderHotelCard(data);
              scrollBottom();
            } else if (currentEvent === 'tool_result') {
              if (data.tool === 'plan_travel') planData = data.result;
            } else if (currentEvent === 'error') {
              fullText += `\n\n❌ 错误: ${data.error}`;
            }
          } catch {}
          currentEvent = '';
        }
      }
    }

    if (!rendered) {
      const planCardHtml = planData ? renderPlanCard(planData) : '';
      finalizeBotBubble(botBubble, fullText, planCardHtml);
    }
  } catch (err) {
    finalizeBotBubble(botBubble, '网络错误，请重试', null);
  }
}

async function ensureSession() {
  if (sessionId) {
    try {
      const resp = await fetch(`/api/chat/${sessionId}/state`);
      if (resp.ok) {
        updateStateUI((await resp.json()).state);
        return;
      }
    } catch {}
  }
  try {
    const resp = await fetch('/api/chat', { method: 'POST' });
    const data = await resp.json();
    sessionId = data.sessionId;
    localStorage.setItem('travel_session_id', sessionId);
    updateStateUI('INIT');
  } catch (err) {
    stateBadge.textContent = '连接失败';
    stateBadge.className = 'state-badge bg-red-100 text-red-700';
  }
}

async function streamConversation(text, botBubble) {
  let fullText = '';
  let planData = null;
  let extraHtml = '';

  const resp = await fetch(`/api/chat/${sessionId}`, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ message: text }),
  });

  if (!resp.ok) {
    const err = await resp.json().catch(() => ({}));
    if (resp.status === 404) {
      localStorage.removeItem('travel_session_id');
      sessionId = null;
      finalizeBotBubble(botBubble, '会话已过期，请点击"新对话"重新开始。', null);
    } else {
      finalizeBotBubble(botBubble, `❌ 请求失败: ${err.error || resp.status}`, null);
    }
    return { fullText, planData };
  }

  const reader = resp.body.getReader();
  const decoder = new TextDecoder();
  let buffer = '';
  let currentEvent = '';

  while (true) {
    const { done, value } = await reader.read();
    if (done) break;
    buffer += decoder.decode(value, { stream: true });
    const lines = buffer.split('\n');
    buffer = lines.pop() ?? '';

    for (const line of lines) {
      if (line.startsWith('event: ')) {
        currentEvent = line.slice(7).trim();
      } else if (line.startsWith('data: ')) {
        try {
          const data = JSON.parse(line.slice(6));
          if (currentEvent === 'text_delta') {
            fullText += data.text;
            botBubble.innerHTML = marked.parse(fullText) + extraHtml;
            scrollBottom();
          } else if (currentEvent === 'state_change') {
            updateStateUI(data.state);
          } else if (currentEvent === 'question') {
            // question is already shown via text_delta
          } else if (currentEvent === 'transport_options') {
            extraHtml = renderTransportCard(data);
            botBubble.innerHTML = marked.parse(fullText) + extraHtml;
            scrollBottom();
          } else if (currentEvent === 'hotel_options') {
            extraHtml = renderHotelCard(data);
            botBubble.innerHTML = marked.parse(fullText) + extraHtml;
            scrollBottom();
          } else if (currentEvent === 'tool_result') {
            if (data.tool === 'plan_travel') planData = data.result;
          } else if (currentEvent === 'error') {
            fullText += `\n\n❌ 错误: ${data.error}`;
            if (data.state) updateStateUI(data.state);
          }
        } catch {}
        currentEvent = '';
      }
    }
  }

  const planCardHtml = planData ? renderPlanCard(planData) : '';
  finalizeBotBubble(botBubble, fullText, extraHtml + planCardHtml);
  return { fullText, planData };
}

async function sendMessage(text) {
  if (streaming || !text.trim() || !sessionId) return;
  streaming = true;
  btnEl.disabled = true;
  addUserBubble(text);

  const botBubble = createBotBubble();
  try {
    await streamConversation(text, botBubble);
  } catch (err) {
    finalizeBotBubble(botBubble, '网络错误，请重试', null);
  }

  streaming = false;
  btnEl.disabled = false;
  inputEl.focus();
}

document.getElementById('newChatBtn').addEventListener('click', async () => {
  if (streaming) return;
  if (sessionId) {
    try { await fetch(`/api/chat/${sessionId}`, { method: 'DELETE' }); } catch {}
  }
  sessionId = null;
  localStorage.removeItem('travel_session_id');
  chatEl.innerHTML = `
    <div class="bg-gray-100 rounded-2xl rounded-tl-sm px-4 py-3 max-w-[80%] text-sm text-gray-700 leading-relaxed msg-content">
      <p>你好！我是你的旅行规划助手。告诉我你想去哪里旅行，我会帮你规划完整的行程。</p>
      <p>比如："我想从上海去北京旅游，7月10号到14号，2个人，预算1万"</p>
    </div>`;
  await ensureSession();
});

formEl.addEventListener('submit', e => {
  e.preventDefault();
  const text = inputEl.value.trim();
  if (!text || streaming) return;
  inputEl.value = '';
  sendMessage(text);
});

ensureSession();
inputEl.focus();
</script>
